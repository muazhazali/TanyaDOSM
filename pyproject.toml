[project]
name = "askdosm"
version = "0.1.0"
description = "A source-grounded natural-language analytics assistant for Malaysian public statistics"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "duckdb>=1.5.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "numpy>=2.3.0",
  "pandas>=2.3.0",
  "plotly>=6.0.0",
  "pyarrow>=21.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "streamlit>=1.49.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askdosm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: requires network access and/or OpenAI credentials",
]

